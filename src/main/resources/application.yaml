server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-andesstay-report

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/24b1cd18-d18e-4855-bcaf-51ac2db566d5/v2.0}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:andesstay}
    password: ${RABBITMQ_PASSWORD:andesstay_dev}
    virtual-host: /
    connection-timeout: 5s

    listener:
      simple:
        # ACK manual: el listener decide ACK, reintento o DLQ.
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 1
        max-concurrency: 3
        # Si el mensaje no se puede ni convertir (JSON inválido),
        # el contenedor lo rechaza SIN reencolar: va directo a la DLQ.
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# =====================================================================
# Nombres de mensajería centralizados (MessagingProperties).
# Deben coincidir con los de ms-andesstay-reservations.
# =====================================================================
andesstay:
  messaging:
    exchanges:
      commands: andesstay.commands
      events: andesstay.events
      dead-letter: andesstay.dlx

    route:
      queue: report.voucher.q
      routing-key: "voucher.gen"
      dead-letter-queue: report.voucher.dlq

    retry:
      # Intentos totales ante un error recuperable antes de ir a la DLQ.
      max-attempts: 3

logging:
  level:
    cl.duoc.andesstay: INFO
